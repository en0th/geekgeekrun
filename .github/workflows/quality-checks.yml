name: Quality checks

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit or tag to verify
        type: string
        default: ''
      artifact_prefix:
        description: Distinguish nested checks in the same release run
        type: string
        default: quality

permissions:
  contents: read

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  node_checks:
    name: Types, regression and build
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-checks
      - name: Prepare Node native dependencies
        run: |
          pnpm rebuild esbuild
          pnpm --filter @geekgeekrun/sqlite-plugin rebuild better-sqlite3
      # dist is removed by the build: readers must run after this step, not in parallel.
      - name: Build SQLite plugin
        run: pnpm build:sqlite
      - name: Check main-process types
        run: pnpm --filter geekgeekrun-ui typecheck:node
      - name: Check renderer types
        run: pnpm --filter geekgeekrun-ui typecheck:web
      - name: Run all regression tests without skips
        run: pnpm test:ci
      - name: Build production UI
        run: pnpm --filter geekgeekrun-ui build
      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.artifact_prefix }}-node-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-reports/regression.xml
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  electron_native:
    name: Electron native SQLite
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-checks
      - name: Prepare Electron native dependencies
        run: |
          pnpm rebuild esbuild
          pnpm --filter geekgeekrun-ui rebuild electron
          pnpm --filter geekgeekrun-ui exec electron-builder install-app-deps
      - name: Build SQLite plugin
        run: pnpm build:sqlite
      - name: Verify Electron ABI and run native regression tests
        run: pnpm test:electron
      - name: Upload native report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.artifact_prefix }}-electron-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-reports/electron-native.xml
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  windows_checks:
    name: Windows host validation
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-checks
      - name: Prepare Node native dependencies
        run: |
          pnpm rebuild esbuild
          pnpm --filter @geekgeekrun/sqlite-plugin rebuild better-sqlite3
      - name: Build SQLite plugin
        run: pnpm build:sqlite
      - name: Check main-process and renderer types
        run: pnpm typecheck
      - name: Run full Windows regression without skips
        run: pnpm test:ci
      - name: Build production UI
        run: pnpm --filter geekgeekrun-ui build
      - name: Verify real Chrome window, task input and collection boundaries
        run: node scripts/ci/browser-smoke.mjs
      - name: Prepare Electron native dependencies
        run: |
          pnpm --filter geekgeekrun-ui rebuild electron
          pnpm --filter geekgeekrun-ui exec electron-builder install-app-deps
      - name: Verify Windows Electron ABI and native regression
        run: pnpm test:electron
      - name: Verify full Electron task shutdown channel
        run: node scripts/ci/electron-stop-smoke.mjs
      - name: Upload Windows reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.artifact_prefix }}-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-reports/regression.xml
            .ci-reports/electron-native.xml
            .ci-reports/browser-smoke.json
            .ci-reports/electron-stop-smoke.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  quality_gate:
    name: Quality gate
    if: always()
    needs: [node_checks, electron_native, windows_checks]
    runs-on: ubuntu-22.04
    steps:
      - name: Require every check to succeed
        env:
          NODE_RESULT: ${{ needs.node_checks.result }}
          ELECTRON_RESULT: ${{ needs.electron_native.result }}
          WINDOWS_RESULT: ${{ needs.windows_checks.result }}
        run: test "$NODE_RESULT" = success && test "$ELECTRON_RESULT" = success && test "$WINDOWS_RESULT" = success
