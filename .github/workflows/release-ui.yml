name: Release UI

on:
  push:
    tags: ['ui-v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Exact candidate commit or tag to build and validate
        required: true
        default: master
        type: string
      previous_tag:
        description: Previous stable installer used for upgrade validation
        default: ui-v0.22.2
        type: string
      publish:
        description: Publish only after every installer has passed validation
        default: false
        type: boolean
  workflow_call:
    inputs:
      tag:
        description: Checked version tag to build and release
        type: string
        required: true
      release_notes:
        type: string
        required: true
      draft:
        type: boolean
        default: false
      prerelease:
        type: boolean
        default: false

permissions:
  contents: read

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  verify:
    uses: ./.github/workflows/quality-checks.yml
    with:
      ref: ${{ inputs.ref || inputs.tag || github.ref }}
      artifact_prefix: tag-release

  build_on_windows:
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/validate-package
        with:
          platform: win32-x64
          previous_tag: ${{ inputs.previous_tag || 'ui-v0.22.2' }}

  build_on_macos:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: macos-15-intel
            identity: darwin-x64
          - os: macos-15
            identity: darwin-arm64
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/validate-package
        with:
          platform: ${{ matrix.platform.identity }}
          previous_tag: ${{ inputs.previous_tag || 'ui-v0.22.2' }}

  build_on_linux:
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/validate-package
        with:
          platform: linux-x64
          previous_tag: ${{ inputs.previous_tag || 'ui-v0.22.2' }}

  installation_gate:
    name: Installer and upgrade gate
    if: always()
    needs: [build_on_windows, build_on_macos, build_on_linux]
    runs-on: ubuntu-22.04
    steps:
      - name: Require every native build and installation to pass
        env:
          WINDOWS: ${{ needs.build_on_windows.result }}
          MACOS: ${{ needs.build_on_macos.result }}
          LINUX: ${{ needs.build_on_linux.result }}
        run: test "$WINDOWS" = success && test "$MACOS" = success && test "$LINUX" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-validation-*
          merge-multiple: true
          path: package-evidence
      - name: Require four complete reports for the exact version and commit
        run: node scripts/release/validate-package-reports.mjs package-evidence --reports-only

  release:
    needs: installation_gate
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binary-geekgeekrun-ui-*
          merge-multiple: true
          path: release-artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-validation-*
          merge-multiple: true
          path: release-artifacts
      - name: Verify installer bytes and prepare release metadata
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          node scripts/release/validate-package-reports.mjs release-artifacts
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const { version } = JSON.parse(fs.readFileSync('packages/ui/package.json'))
          const notes = process.env.RELEASE_NOTES || JSON.parse(fs.readFileSync('packages/ui/src/common/release-notes.json'))[version]?.notes
          if (!notes?.trim()) throw Error('Release notes are required')
          fs.writeFileSync('release-body.txt', notes)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=ui-v${version}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()}\n`)
          JS
        id: metadata
      - name: Publish validated release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          repo: geekgeekrun
          prerelease: ${{ github.event_name == 'push' || inputs.prerelease || false }}
          draft: ${{ inputs.draft || false }}
          allowUpdates: false
          artifactErrorsFailBuild: true
          immutableCreate: ${{ !inputs.draft }}
          artifacts: release-artifacts/*.exe,release-artifacts/*.dmg,release-artifacts/*.deb
          tag: ${{ steps.metadata.outputs.tag }}
          commit: ${{ steps.metadata.outputs.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          bodyFile: release-body.txt
